# Same rules as App's pyproject.toml; release.sh preflight runs it.
line-length = 120
target-version = "py310"
extend-exclude = ["obs-src", "dist", "obs-install"]

[lint]
select = ["E9", "F", "B", "UP", "I"]
ignore = ["UP015"]  # explicit open(..., "r") is the house style

[lint.isort]
# Dev/release/'s modules, imported by path (release.sh, tests) - not found
# as first-party on their own since they moved out of Dev/.
known-first-party = ["generate_checksums", "generate_install_manifest", "release_common"]
