[pytest]
filterwarnings =
    # dbus-next 0.2.3 (the Linux tray's D-Bus) on Python 3.13+. ClipEm's own
    # Linux Python is 3.12 (LINUX_PYTHON_VERSION in release.sh); tests/test_dependency_pins.py fails before it's
    # bumped to 3.15, where this stops being a warning.
    ignore:'typing.no_type_check_decorator' is deprecated:DeprecationWarning:dbus_next
