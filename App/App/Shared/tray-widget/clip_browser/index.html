<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipEm Editor</title>
  <link rel="icon" href="/clipem-editor/icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside id="sidebar">
    <header class="sidebar-head">
      <h1>Clips</h1>
      <span id="clip-count" class="muted"></span>
      <button id="change-folder" class="icon-btn" title="Choose another folder to view clips from" aria-label="Change folder" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 4.25v8a1 1 0 0 0 1 1h10.5a1 1 0 0 0 1-1v-6.5a1 1 0 0 0-1-1H8L6.5 3.25H2.75a1 1 0 0 0-1 1z"/></svg></button>
    </header>
    <div id="sound-banner" class="banner" hidden>Click anywhere to turn on hover sound</div>
    <ul id="clip-list" aria-label="Clips, newest first"></ul>
    <p id="empty" class="muted" hidden>No clips yet - save one with your clip hotkey.</p>
  </aside>
  <main id="main">
    <header id="toolbar">
      <button id="toggle-sidebar" title="Show or hide the clip list (Tab)" aria-pressed="true"><svg class="arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5 5 8l5.5 5.5"/></svg>Clips</button>
      <div class="title-row">
        <label id="out-name-wrap" title="Name for the exported file - leave it as the clip's name to add -edit, -discord etc.">
          <input id="out-name" type="text" spellcheck="false" autocomplete="off" aria-label="Export name">
          <span class="muted small">.mp4</span>
        </label>
        <span id="clip-meta" class="muted"></span>
      </div>
      <div class="spacer"></div>
      <span id="status" role="status"></span>
      <button id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
      <button id="reset" title="Undo every edit to this clip" disabled>Reset</button>
    </header>
    <div id="player-wrap">
      <!-- The video at its fitted size; zoomed and panned as a whole (view.js). -->
      <div id="stage" hidden>
        <video id="player" preload="auto" playsinline muted></video>
        <div id="crop">
          <div class="crop-shade" data-side="top"></div>
          <div class="crop-shade" data-side="bottom"></div>
          <div class="crop-shade" data-side="left"></div>
          <div class="crop-shade" data-side="right"></div>
          <div id="crop-box">
            <div class="crop-handle" data-edge="nw"></div>
            <div class="crop-handle" data-edge="n"></div>
            <div class="crop-handle" data-edge="ne"></div>
            <div class="crop-handle" data-edge="w"></div>
            <div class="crop-handle" data-edge="e"></div>
            <div class="crop-handle" data-edge="sw"></div>
            <div class="crop-handle" data-edge="s"></div>
            <div class="crop-handle" data-edge="se"></div>
            <span id="crop-size"></span>
          </div>
        </div>
      </div>
      <div id="zoom-controls">
        <div id="crop-controls">
          <button id="crop-toggle" class="overlay-button" title="Show the crop handles" aria-pressed="false">Crop</button>
          <button id="crop-lock" class="overlay-button" hidden></button>
        </div>
        <div>
          <button id="zoom-in" class="overlay-button" title="Zoom in (mouse wheel)" aria-label="Zoom in"></button>
          <button id="zoom-out" class="overlay-button" title="Zoom out (mouse wheel)" aria-label="Zoom out"></button>
          <button id="zoom-fit" class="overlay-button" title="Full frame" aria-label="Full frame"></button>
          <button id="crop-reset" class="overlay-button" title="Remove the crop" hidden>Uncrop</button>
        </div>
      </div>
      <div id="master">
        <canvas id="meter" title="Preview level (RMS, dBFS) - what you hear, after the track edits" hidden></canvas>
        <div id="master-fader">
        <input id="master-slider" type="range" min="-30" max="12" step="0.5" value="0" orient="vertical"
               aria-label="Master volume" title="Master volume - the gain on the mix and the Mix track in the export (double-click: 0 dB)">
        <span id="master-value" class="small mono">0 dB</span>
        </div>
        <button id="auto-mix" title="Level Out Audio on every track, equal volumes, then the master set so the mix lands at about -14 LUFS">Auto Mix</button>
      </div>
      <p id="no-selection" class="muted">Pick a clip on the left.</p>
    </div>
    <!-- Outside #editor: it takes its room from the video, so the tracks stay put. -->
    <div id="panel" hidden></div>
    <div id="splitter" role="separator" aria-orientation="horizontal"
         title="Drag to resize the video and the tracks (double-click to reset)" hidden></div>
    <section id="editor" hidden>
      <div id="transport">
        <button id="play" class="icon" title="Play / pause (Space)" aria-label="Play">&#9654;</button>
        <span id="time" class="mono"></span>
        <span id="kept-length" class="muted"></span>
        <div class="spacer"></div>
        <span class="muted hint" title="Hold Alt while dragging on a stereo track to select just its left (top) or right (bottom) channel - a volume change there only affects that side.">Drag on the timeline to select &middot; drag the handles to trim &middot; Alt-drag a stereo track for one channel</span>
      </div>
      <div id="timeline-scroll">
        <div id="timeline"></div>
        <button id="toggle-unused" class="link" hidden></button>
      </div>
      <footer id="export-bar">
        <button id="export-full" class="primary">Export full quality</button>
        <button id="export-discord" class="primary">Export for Discord</button>
        <span id="discord-note" class="muted"></span>
        <div id="custom-export">
          <span class="muted small">Custom</span>
          <select id="custom-height" title="Resolution"></select>
          <select id="custom-fps" title="Frame rate"></select>
          <select id="custom-bitrate" title="Bitrate (largest file size - simple footage comes out smaller)"></select>
          <button id="export-custom" class="primary" title="Export with these settings - choose where to save it">Export As...</button>
        </div>
        <div class="spacer"></div>
        <button id="edit-custom" hidden></button>
        <button id="reveal">Show in folder</button>
      </footer>
      <div id="export-progress" hidden>
        <div class="bar"><div class="fill"></div></div>
        <span id="export-message"></span>
        <button id="export-cancel">Cancel</button>
      </div>
      <div id="export-done" hidden>
        <span id="export-done-message"></span>
        <button id="export-play" title="Open the exported video in your default video player">Play</button>
        <button id="export-reveal" title="Show the exported video in its folder">Show in folder</button>
      </div>
    </section>
  </main>
  <script src="browser.js"></script>
  <script src="editor.js"></script>
  <script src="view.js"></script>
</body>
</html>
