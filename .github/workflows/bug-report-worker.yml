name: Bug report worker

on:
  push:
    branches: [main]
    paths: ["BugReportWorker/**", ".github/workflows/bug-report-worker.yml"]
  pull_request:
    paths: ["BugReportWorker/**", ".github/workflows/bug-report-worker.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BugReportWorker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test
