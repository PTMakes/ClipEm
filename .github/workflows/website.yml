name: Website

on:
  push:
    branches: [main]
    paths: ["Website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["Website/**", ".github/workflows/website.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: Website/.nvmrc
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Every manifest has a signature
        run: |
          for manifest in public/updates/*.json; do
            [ -s "$manifest.sig" ] || { echo "$manifest has no signature" >&2; exit 1; }
          done
